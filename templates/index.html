<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFlow — Inicio</title>

    <!-- Flask genera la dirección del archivo CSS. -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >
</head>
<body>
    <main class="bienvenida">
        <span class="marca">TECHFLOW SOLUTIONS</span>

        <h1>Tu tienda, organizada.</h1>

        <p>
            Estamos construyendo un sistema para gestionar
            productos, inventario, ventas y estadísticas.
        </p>

        <span class="estado">Primera pantalla funcionando</span>

        <!-- El botón solicita una comprobación al servidor. -->
        <div class="comprobacion">
            <button id="comprobar-servidor" type="button">
                Comprobar servidor
            </button>

            <p id="resultado-servidor" role="status" aria-live="polite">
                Todavía no se realizó la comprobación.
            </p>
        </div>
    </main>

    <!-- Cargamos JavaScript después de los elementos que utiliza. -->
    <script src="{{ url_for('static', filename='js/inicio.js') }}"></script>
</body>
</html>
